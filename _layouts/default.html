<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141c18" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/images/app-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header wrap">
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="Swolseye home"><img src="{{ '/assets/images/app-icon.png' | relative_url }}" width="36" height="36" alt="">Swolseye</a>
  <nav aria-label="Main navigation">
    <a href="{{ '/support/' | relative_url }}"{% if page.url == '/support/' %} aria-current="page"{% endif %}>Support</a>
    <a href="{{ '/faq/' | relative_url }}"{% if page.url == '/faq/' %} aria-current="page"{% endif %}>FAQ</a>
    <a href="{{ '/contact/' | relative_url }}"{% if page.url == '/contact/' %} aria-current="page"{% endif %}>Contact</a>
  </nav>
</header>
<main id="main" class="wrap {% unless page.home %}reading{% endunless %}">{{ content }}</main>
<footer class="site-footer wrap">
  <p>Swolseye <span>· A little less counting. A little more darts.</span></p>
  <nav aria-label="Footer navigation"><a href="{{ '/support/' | relative_url }}">Support</a><a href="{{ '/contact/' | relative_url }}">Contact</a><a href="{{ '/privacy/' | relative_url }}">Privacy</a></nav>
  <small>© {{ 'now' | date: '%Y' }} Swolseye</small>
</footer>
</body>
</html>
